name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: law_school_matrix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller DecisionMatrix.spec

      - name: Create ZIP
        run: |
          cd dist
          zip -r DecisionMatrix-macOS.zip DecisionMatrix.app

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: DecisionMatrix-macOS
          path: law_school_matrix/dist/DecisionMatrix-macOS.zip